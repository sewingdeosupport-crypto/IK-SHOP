<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IK Shop Wholesale | Quality Products</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f8; color: #222; }

    /* Top Announcement Bar */
    .top-bar {
      background: #000;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 20px;
      font-size: 12px;
    }
    .top-bar span { font-weight: 500; }

    /* DeoDap Style Header */
    header {
      background: #0d1b2a;
      color: #fff;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }
    .logo-container { display: flex; align-items: center; gap: 5px; }
    .logo-main { font-size: 26px; font-weight: 900; color: #e63946; text-transform: uppercase; text-decoration: none; letter-spacing: -0.5px; }
    .logo-sub { font-size: 10px; background: #fff; color: #0d1b2a; padding: 2px 4px; font-weight: bold; border-radius: 2px; }

    .search-bar { display: flex; flex: 1; max-width: 550px; }
    .search-bar input { width: 100%; padding: 10px 14px; border: none; border-radius: 4px 0 0 4px; outline: none; font-size: 14px; }
    .search-bar button { padding: 10px 20px; background: #e63946; color: #fff; border: none; border-radius: 0 4px 4px 0; cursor: pointer; font-weight: bold; font-size: 14px; }

    .header-actions { display: flex; gap: 20px; align-items: center; font-size: 13px; }
    .header-action-item { display: flex; align-items: center; gap: 6px; cursor: pointer; }

    /* Category Nav Strip */
    .nav-strip { background: #1b263b; display: flex; padding: 0 20px; align-items: center; }
    .cat-btn-main { background: #e63946; color: #fff; padding: 12px 20px; border: none; font-weight: bold; cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 8px; }
    .nav-links { display: flex; list-style: none; overflow-x: auto; white-space: nowrap; }
    .nav-links li a { color: #fff; text-decoration: none; padding: 12px 16px; display: block; font-size: 13px; font-weight: 500; }
    .nav-links li a:hover { background: rgba(255,255,255,0.1); }

    /* Main Container Layout */
    .layout-container { display: flex; margin: 20px auto; width: min(100% - 30px, 1280px); gap: 20px; }

    /* Left Sidebar Categories */
    .sidebar { width: 240px; background: #fff; border-radius: 8px; border: 1px solid #e0e0e0; flex-shrink: 0; }
    .sidebar-header { background: #0d1b2a; color: #fff; padding: 12px 15px; font-weight: bold; font-size: 14px; border-radius: 7px 7px 0 0; display: flex; align-items: center; gap: 8px; }
    .category-list { list-style: none; }
    .category-list li { border-bottom: 1px solid #f0f0f0; }
    .category-list li a { display: flex; justify-content: space-between; align-items: center; padding: 11px 15px; color: #333; text-decoration: none; font-size: 13px; font-weight: 500; transition: 0.2s; }
    .category-list li a:hover, .category-list li.active a { background: #fff0f1; color: #e63946; }

    /* Main Content Area */
    .main-content { flex: 1; }

    /* Hero Banner Area */
    .hero-section { display: grid; grid-template-columns: 1fr 220px; gap: 15px; margin-bottom: 25px; }
    .promo-banner { background: linear-gradient(135deg, #e63946 0%, #a81c27 100%); color: white; padding: 35px 25px; border-radius: 12px; position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: center; box-shadow: 0 4px 15px rgba(230,57,70,0.2); }
    .promo-tag { background: #fff; color: #e63946; font-size: 11px; font-weight: bold; padding: 4px 10px; border-radius: 20px; width: fit-content; text-transform: uppercase; margin-bottom: 10px; }
    .promo-title { font-size: 38px; font-weight: 900; line-height: 1.1; margin-bottom: 10px; }
    .promo-subtitle { font-size: 14px; opacity: 0.9; margin-bottom: 20px; }
    .promo-btn { background: #0d1b2a; color: #fff; border: none; padding: 10px 22px; font-weight: bold; border-radius: 25px; cursor: pointer; width: fit-content; font-size: 13px; }

    .side-badges { display: flex; flex-direction: column; gap: 12px; }
    .badge-card { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 15px; text-align: center; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .badge-icon { font-size: 22px; margin-bottom: 6px; }
    .badge-title { font-size: 13px; font-weight: bold; color: #0d1b2a; }
    .badge-desc { font-size: 11px; color: #777; margin-top: 2px; }

    /* Products Grid */
    .section-heading { font-size: 18px; font-weight: bold; margin-bottom: 15px; color: #0d1b2a; display: flex; align-items: center; gap: 8px; }
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; }
    
    .product-card { background: #fff; border: 1px solid #e0e0e0; border-radius: 10px; padding: 15px; text-align: left; transition: transform 0.2s, box-shadow 0.2s; position: relative; }
    .product-card:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.08); }
    
    .verified-badge { background: #eaf7ef; color: #16834a; font-size: 10px; font-weight: bold; padding: 3px 8px; border-radius: 4px; display: inline-block; margin-bottom: 8px; border: 1px solid #a5d6b8; }
    .product-image { width: 100%; height: 170px; object-fit: contain; background: #fafafa; border-radius: 6px; margin-bottom: 10px; }
    .product-title { font-size: 15px; font-weight: bold; margin-bottom: 6px; color: #222; }
    
    .rating-box { font-size: 12px; color: #f39c12; margin-bottom: 8px; display: flex; align-items: center; gap: 4px; }
    .price-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
    .current-price { color: #e63946; font-size: 20px; font-weight: bold; }
    .mrp-price { color: #888; text-decoration: line-through; font-size: 13px; }
    .discount-tag { background: #e63946; color: #fff; font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 3px; }
