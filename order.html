<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b43"><title>Checkout | IK Shop</title>
<style>
:root{--n:#101b43;--p:#f04483;--ink:#252a40;--muted:#7a8095;--line:#e8eaf2;--bg:#f6f7fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:"Segoe UI",Arial,sans-serif;color:var(--ink)}header{background:var(--n);color:#fff;padding:15px 5%;display:flex;align-items:center;justify-content:space-between;gap:10px}header a{color:#fff;text-decoration:none}.brand{font-size:23px;font-weight:900}.brand span{color:#ffb4d0}.wrap{max-width:1000px;width:92%;margin:28px auto;display:grid;grid-template-columns:1.2fr .8fr;gap:20px}.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 8px 25px #101b4309}.panel h1,.panel h2{color:var(--n);margin:0 0 16px}.panel h1{font-size:25px}.panel h2{font-size:19px}.hint{color:var(--muted);font-size:13px;line-height:1.6}.item{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.item img{width:70px;height:70px;object-fit:contain;background:#f6f7fb;border-radius:8px}.item strong{display:block;font-size:13px;color:var(--n)}.item small{display:block;color:var(--muted);margin-top:5px}.qty{display:flex;align-items:center;gap:9px;margin-top:8px}.qty button{border:1px solid var(--line);background:white;border-radius:6px;width:28px;height:28px;font-weight:bold}.lineprice{font-weight:800;color:var(--p);font-size:13px;white-space:nowrap}.total{display:flex;justify-content:space-between;gap:12px;font-weight:900;font-size:19px;margin-top:18px;color:var(--n)}label{display:block;font-size:12px;font-weight:800;color:var(--n);margin:13px 0 6px}input,textarea,select{width:100%;border:1px solid #dfe3ed;border-radius:8px;padding:12px;font:inherit;font-size:14px}textarea{resize:vertical}.btn{display:block;width:100%;border:0;border-radius:8px;background:var(--p);color:white;padding:14px;font-weight:900;margin-top:16px;cursor:pointer}.secondary{display:block;text-align:center;color:var(--n);font-size:13px;font-weight:800;text-decoration:none;margin-top:13px}.status{display:none;padding:12px;border-radius:8px;background:#fff0f6;color:#9c2151;font-size:13px;line-height:1.5;margin-top:12px}.empty{text-align:center;padding:25px 5px;color:var(--muted)}@media(max-width:720px){.wrap{grid-template-columns:1fr;margin:16px auto}.panel{padding:17px}.item{grid-template-columns:58px minmax(0,1fr) auto;gap:9px}.item img{width:58px;height:58px}}
</style></head><body>
<header><a class="brand" href="index.html">IK <span>SHOP</span></a><a href="index.html">← Continue shopping</a></header>
<main class="wrap"><section class="panel"><h1>Your Order</h1><p class="hint">Review every item, adjust quantities, and submit them together as one order.</p><div id="items"></div><div class="total"><span>Total</span><span id="total">₹0</span></div><p class="hint" style="margin-top:9px">Your selected products are kept in this browser's cart until you remove them.</p><a class="secondary" href="index.html">＋ Add more products</a></section>
<section class="panel"><h2>Delivery details</h2><form id="checkoutForm"><label for="name">Full name</label><input id="name" name="name" autocomplete="name" required><label for="phone">Mobile number</label><input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" required><label for="address">Complete delivery address</label><textarea id="address" name="address" rows="3" autocomplete="street-address" required></textarea><label for="payment">Payment method</label><select id="payment" name="payment"><option value="Cash on Delivery">Cash on Delivery</option><option value="Online Payment">Online Payment (payment setup required)</option></select><button class="btn" type="submit" id="submit">Place Order</button><div class="status" id="status"></div></form></section></main>
<script>
const products={"suto-stand":{name:"Sewing Machine Suto Stand",price:199,image:"Sewing%20Machine%20Suto%20Stand.jpeg"},"bobbin-holder":{name:"All Sewing Machine Bobbin Holder",price:299,image:"bobbin-holder.jpg"},"bobbin-case-1":{name:"SELECT Bobbin Case (1 Piece)",price:89,image:"bobbin-case-poster.png"},"bobbin-case-6":{name:"SELECT Bobbin Case (Pack of 6)",price:339,image:"bobbin-case-poster.png"},"sewing-oil":{name:"Sewing Machine Oil (High Grade)",price:199,image:"sewing-oil.png"},"lal-mariz":{name:"Premium Lal Mariz Powder",price:99,image:"lal-mariz.jpg"},"organ-needle-1":{name:"ORGAN Needles DBx1 (1 Piece)",price:119,image:"organ-needle.jpg"},"organ-needle-5":{name:"ORGAN Needles DBx1 (5 Pieces)",price:449,image:"organ-needle.jpg"},"white-crane-1":{name:"White Crane Needles (1 Pack of 10)",price:55,image:"white-crane-needle.jpg"},"white-crane-10":{name:"White Crane Needles (10 Packs)",price:500,image:"white-crane-needle.jpg"},"rotary-hook-1":{name:"Pilyselect Rotary Hook (1 Piece)",price:599,image:"pilyselect-rotary-hook.jpg"},"rotary-hook-2":{name:"Pilyselect Rotary Hook (2 Pieces)",price:1049,image:"pilyselect-rotary-hook.jpg"}};
const getCart=()=>{try{return JSON.parse(localStorage.getItem("ikShopCart")||"[]")}catch(e){return []}};
let cart=getCart();const money=n=>"₹"+n.toLocaleString("en-IN");
function render(){cart=cart.filter(i=>products[i.id]&&i.qty>0);localStorage.setItem("ikShopCart",JSON.stringify(cart));const wrap=document.getElementById("items");wrap.innerHTML="";let total=0;if(!cart.length){wrap.innerHTML='<div class="empty">Your cart is empty.<br><br><a href="index.html">Browse products</a></div>';document.getElementById("total").textContent=money(0);document.getElementById("submit").disabled=true;return}document.getElementById("submit").disabled=false;cart.forEach(item=>{const p=products[item.id],line=p.price*item.qty;total+=line;const row=document.createElement("article");row.className="item";const img=document.createElement("img");img.src=p.image;img.alt=p.name;img.onerror=function(){this.onerror=null;this.src="https://placehold.co/120x120/f6f7fb/101b43?text=IK+Shop"};const info=document.createElement("div"),name=document.createElement("strong"),price=document.createElement("small"),qty=document.createElement("div");name.textContent=p.name;price.textContent=money(p.price)+" each";qty.className="qty";const minus=document.createElement("button");minus.type="button";minus.textContent="−";minus.onclick=()=>{item.qty--;cart=cart.filter(x=>x.qty>0);render()};const count=document.createElement("span");count.textContent=item.qty;const plus=document.createElement("button");plus.type="button";plus.textContent="+";plus.onclick=()=>{item.qty++;render()};const remove=document.createElement("button");remove.type="button";remove.textContent="×";remove.title="Remove item";remove.onclick=()=>{cart=cart.filter(x=>x.id!==item.id);render()};qty.append(minus,count,plus,remove);info.append(name,price,qty);const lineEl=document.createElement("div");lineEl.className="lineprice";lineEl.textContent=money(line);row.append(img,info,lineEl);wrap.append(row)});document.getElementById("total").textContent=money(total)}
document.getElementById("checkoutForm").addEventListener("submit",async e=>{e.preventDefault();cart=getCart().filter(i=>products[i.id]&&i.qty>0);if(!cart.length){alert("Please add products to your cart first.");return}const name=document.getElementById("name").value.trim(),phone=document.getElementById("phone").value.trim(),address=document.getElementById("address").value.trim(),payment=document.getElementById("payment").value;const total=cart.reduce((s,i)=>s+products[i.id].price*i.qty,0);const orderText=cart.map(i=>products[i.id].name+" × "+i.qty+" = ₹"+(products[i.id].price*i.qty)).join(" | ");const status=document.getElementById("status");if(payment==="Online Payment"){status.style.display="block";status.textContent="Online payment is not connected on this multi-item checkout yet. Choose Cash on Delivery, or contact IK Shop to arrange payment.";return}const btn=document.getElementById("submit");btn.disabled=true;btn.textContent="Submitting order…";status.style.display="block";status.textContent="Sending your order details…";try{const data=new URLSearchParams();data.append("name",name);data.append("phone",phone);data.append("address",address);data.append("product",orderText);data.append("productName",orderText);data.append("quantity",String(cart.reduce((s,i)=>s+i.qty,0)));data.append("unitPrice",String(total));data.append("totalPrice",String(total));data.append("paymentStatus","Pending");data.append("paymentMethod","Cash on Delivery");await fetch("https://script.google.com/macros/s/AKfycbwf9kNdVVRe7TfAmQtS4KmShYVo1ufVk5EFnuv41OaH_kzVytpBcwmtyrGv-KvWFPdl/exec",{method:"POST",body:data,mode:"no-cors"});status.textContent="Order request sent. Because the order service does not return a readable confirmation, please contact IK Shop if you do not receive confirmation. Your cart has been kept until you confirm the order was received.";status.style.background="#eaf8ef";status.style.color="#176b3b";}catch(err){status.textContent="Could not send the order. Please check your internet and try again.";status.style.display="block"}finally{btn.disabled=false;btn.textContent="Place Order"}});
render();
</script></body></html>
