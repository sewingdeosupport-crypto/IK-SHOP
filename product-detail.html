<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details | IK Shop</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f8; color: #222; }

    header { background: #0d1b2a; color: #fff; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; }
    .logo-main { font-size: 24px; font-weight: 900; color: #e63946; text-decoration: none; }

    .detail-container { display: flex; gap: 30px; width: min(100% - 30px, 1100px); margin: 30px auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }

    /* Left Gallery Section */
    .gallery-section { display: flex; gap: 15px; width: 50%; }
    .thumbnail-list { display: flex; flex-direction: column; gap: 10px; }
    .thumbnail-list img { width: 65px; height: 65px; object-fit: contain; border: 1px solid #ddd; border-radius: 6px; cursor: pointer; background: #fafafa; padding: 4px; }
    .thumbnail-list img:hover, .thumbnail-list img.active { border-color: #e63946; }
    .main-preview-img { width: 100%; height: 400px; object-fit: contain; background: #fafafa; border: 1px solid #eee; border-radius: 8px; padding: 10px; }

    /* Right Info Section */
    .info-section { width: 50%; }
    .verified-badge { background: #eaf7ef; color: #16834a; font-size: 11px; font-weight: bold; padding: 4px 10px; border-radius: 4px; display: inline-block; margin-bottom: 10px; }
    .product-title { font-size: 24px; font-weight: bold; margin-bottom: 10px; color: #111; }
    .sku-text { font-size: 12px; color: #666; margin-bottom: 15px; }
    
    .shipping-box { background: #f8f9fa; border: 1px solid #e0e0e0; padding: 10px 15px; border-radius: 6px; font-size: 13px; margin-bottom: 15px; border-left: 4px solid #16834a; }
    
    .price-row { display: flex; align-items: baseline; gap: 12px; margin-bottom: 20px; }
    .current-price { color: #e63946; font-size: 28px; font-weight: bold; }
    .mrp-price { color: #888; text-decoration: line-through; font-size: 16px; }
    .discount-tag { background: #e63946; color: #fff; font-size: 11px; font-weight: bold; padding: 3px 8px; border-radius: 4px; }

    .activity-box { background: #fff9f9; border: 1px dashed #e63946; padding: 10px 15px; border-radius: 6px; font-size: 13px; margin-bottom: 20px; color: #c92a37; }

    .action-buttons { display: flex; gap: 15px; }
    .btn-cart { flex: 1; background: #0d1b2a; color: #fff; border: none; padding: 14px; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 15px; }
    .btn-buy { flex: 1; background: #e63946; color: #fff; border: none; padding: 14px; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 15px; text-transform: uppercase; }

    /* Modal Checkout */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; }
    .modal-card { background: #fff; width: min(100% - 20px, 440px); border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    .modal-top { background: #0d1b2a; color: #fff; padding: 12px 18px; display: flex; justify-content: space-between; font-weight: bold; }
    .modal-body { padding: 20px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 4px; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; }
    .submit-btn { width: 100%; background: #e63946; color: #fff; border: none; padding: 13px; border-radius: 6px; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 10px; }

    @media (max-width: 768px) { 
      .detail-container { flex-direction: column; } 
      .gallery-section { width: 100%; flex-direction: column-reverse; } 
      .info-section { width: 100%; } 
      .thumbnail-list { flex-direction: row; }
    }
  </style>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>

  <header>
    <a href="index.html" class="logo-main">IK SHOP</a>
    <a href="index.html" style="color: #fff; text-decoration: none; font-size: 14px;">← Back to Home</a>
  </header>

  <div class="detail-container">
    <div class="gallery-section">
      <div class="thumbnail-list" id="thumbList"></div>
      <div>
        <img id="mainImage" src="" class="main-preview-img" onerror="this.src='https://via.placeholder.com/400'">
      </div>
    </div>

    <div class="info-section">
      <span class="verified-badge">✔ GENUINE & VERIFIED</span>
      <h1 class="product-title" id="pTitle">Product Name</h1>
      <div class="sku-text" id="pSku">SKU: ik_product_01</div>

      <div class="shipping-box">
        🚚 <b>Free Shipping</b> available across all locations.
      </div>

      <div class="price-row">
        <span class="current-price" id="pPrice">₹0.00</span>
        <span class="mrp-price" id="pMrp">₹0.00</span>
        <span class="discount-tag" id="pDiscount">0% OFF</span>
      </div>

      <div class="activity-box">
        🔴 14 people near your area bought this today
      </div>

      <div class="action-buttons">
        <button class="btn-cart" onclick="alert('Product added to cart!')">ADD TO CART</button>
        <button class="btn-buy" onclick="openCheckout()">BUY NOW</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="checkoutModal">
    <div class="modal-card">
      <div class="modal-top">
        <span>Instant Express Checkout</span>
        <span style="cursor: pointer;" onclick="closeCheckout()">&times;</span>
      </div>
      <div class="modal-body">
        <form id="orderForm">
          <div class="form-group">
            <label>Product Name</label>
            <input type="text" name="product" id="prodName" readonly>
          </div>
          <div class="form-group">
            <label>Price (INR)</label>
            <input type="text" name="totalPrice" id="prodPrice" readonly>
          </div>
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="name" id="custName" placeholder="Enter your name" required>
          </div>
          <div class="form-group">
            <label>Mobile Number</label>
            <input type="tel" name="phone" id="custPhone" placeholder="10-digit mobile number" required>
          </div>
          <div class="form-group">
            <label>Complete Address</label>
            <textarea name="address" id="custAddress" rows="2" placeholder="House No, Street, Pincode" required></textarea>
          </div>
          <div class="form-group">
            <label>Payment Method</label>
            <select name="paymentMethod" id="payMethod">
              <option value="Online Payment">Online Payment (Razorpay)</option>
              <option value="Cash on Delivery">Cash on Delivery (COD)</option>
            </select>
          </div>
          <button type="submit" class="submit-btn">Proceed to Order</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    const productsDB = {
      "suto-stand": {
        title: "Sewing Machine Suto Stand",
        price: 199,
        mrp: 349,
        discount: "43% OFF",
        sku: "SKU: ik_suto_stand_01 | DSIN: 19933",
        images: ["./Sewing Machine Suto Stand.jpeg", "./bobbin-holder.jpg", "./sewing-oil.png"]
      },
      "bobbin-holder": {
        title: "All Sewing Machine Bobbin Holder",
        price: 299,
        mrp: 499,
        discount: "40% OFF",
        sku: "SKU: ik_bobbin_02 | DSIN: 19934",
        images: ["./bobbin-holder.jpg", "./Sewing Machine Suto Stand.jpeg", "./sewing-oil.png"]
      },
      "sewing-oil": {
        title: "Sewing Machine Oil (High Grade)",
        price: 199,
        mrp: 399,
        discount: "50% OFF",
        sku: "SKU: ik_oil_03 | DSIN: 19935",
        images: ["./sewing-oil.png", "./Sewing Machine Suto Stand.jpeg", "./bobbin-holder.jpg"]
      },
      "lal-mariz": {
        title: "Premium Lal Mariz Powder",
        price: 99,
        mrp: 199,
        discount: "50% OFF",
        sku: "SKU: ik_mariz_04 | DSIN: 19936",
        images: ["./lal-mariz.jpg", "./sewing-oil.png", "./bobbin-holder.jpg"]
      }
    };

    const urlParams = new URLSearchParams(window.location.search);
    const productId = urlParams.get('id') || "suto-stand";
    const currentProd = productsDB[productId] || productsDB["suto-stand"];

    document.getElementById("pTitle").innerText = currentProd.title;
    document.getElementById("pSku").innerText = currentProd.sku;
    document.getElementById("pPrice").innerText = "₹" + currentProd.price + ".00";
    document.getElementById("pMrp").innerText = "₹" + currentProd.mrp + ".00";
    document.getElementById("pDiscount").innerText = currentProd.discount;
    document.getElementById("mainImage").src = currentProd.images[0];

    document.getElementById("prodName").value = currentProd.title;
    document.getElementById("prodPrice").value = "₹" + currentProd.price + ".00";

    const thumbList = document.getElementById("thumbList");
    thumbList.innerHTML = "";
    currentProd.images.forEach((imgSrc, index) => {
      const imgEl = document.createElement("img");
      imgEl.src = imgSrc;
      if (index === 0) imgEl.classList.add("active");
      imgEl.onclick = function() {
        document.querySelectorAll(".thumbnail-list img").forEach(i => i.classList.remove("active"));
        this.classList.add("active");
        document.getElementById("mainImage").src = imgSrc;
      };
      thumbList.appendChild(imgEl);
    });

    function openCheckout() {
      document.getElementById("checkoutModal").style.display = "flex";
    }
    function closeCheckout() {
      document.getElementById("checkoutModal").style.display = "none";
    }

    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwf9kNdVVRe7TfAmQtS4KmShYVo1ufVk5EFnuv41OaH_kzVytpBcwmtyrGv-KvWFPdl/exec";

    document.getElementById("orderForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const name = document.getElementById("custName").value;
      const phone = document.getElementById("custPhone").value;
      const address = document.getElementById("custAddress").value;
      const payMethod = document.getElementById("payMethod").value;

      closeCheckout();

      if (payMethod === "Online Payment") {
        var options = {
          "key": "rzp_live_TrppjNfmdmkJLQ", 
          "amount": currentProd.price * 100, 
          "currency": "INR",
          "name": "IK SHOP",
          "description": currentProd.title,
          "handler": async function (response){
            alert("✅ Payment Successful! Payment ID: " + response.razorpay_payment_id);
            await saveOrderToSheet(currentProd.title, "₹" + currentProd.price, name, phone, address, "Online Paid (" + response.razorpay_payment_id + ")");
          },
          "prefill": { "name": name, "contact": phone },
          "theme": { "color": "#e63946" }
        };
        var rzp1 = new Razorpay(options);
        rzp1.open();
      } else {
        await saveOrderToSheet(currentProd.title, "₹" + currentProd.price, name, phone, address, "Cash on Delivery");
        alert("✅ Order placed successfully via COD!");
      }
    });

    async function saveOrderToSheet(product, price, name, phone, address, status) {
      try {
        const formData = new URLSearchParams();
        formData.append("product", product);
        formData.append("totalPrice", price);
        formData.append("name", name);
        formData.append("phone", phone);
        formData.append("address", address);
        formData.append("paymentMethod", status);

        await fetch(SCRIPT_URL, { method: "POST", body: formData, mode: "no-cors" });
      } catch (err) {
        console.log("Sheet error", err);
      }
    }
  </script>
</body>
</html>
